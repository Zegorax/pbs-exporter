groups:
  - name: ProxmoxBackupServer.rules

    rules:
      - alert: ProxmoxBackupHostDown
        expr: "absent(pbs_available)"
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Proxmox Backup Server down
          description: "Proxmox Backup Server {{ $labels.instance }} is not available."

      - alert: ProxmoxBackupSnapshotVerifyFailed
        expr: 'sum by (vm_id) (max_over_time(pbs_snapshot_vm_last_verify[2d]) and pbs_snapshot_vm_count > 1) == 0'
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Last verified Proxmox snapshot older than 2 days
          description: "Last verified snapshot of vm {{ $labels.vm_name }} is older than 2 days."

      - alert: ProxmoxBackupSnapshotOutdated
        expr: '(time() - avg_over_time(pbs_snapshot_vm_last_timestamp[5m])) / 3600 / 24 > 2'
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Last snapshot of vm is older than 2 days
          description: "Last snapshot of vm {{ $labels.vm_name }} is older than 2 days."

      - alert: ProxmoxBackupPoolDiskOutOfSpace
        expr: "pbs_used / pbs_size * 100 > 90"
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Proxmox datastore out of space (datastore {{ $labels.datastore }})
          description: "Disk is almost full (< 10% left)\n  VALUE = {{ $value }}"

      - alert: ProxmoxBackupPoolDiskFillingUpInFourDays
        annotations:
          description: Based on recent sampling, the datastore {{ $labels.datastore }} is expected to fill up withing four days. Currently {{ $value | humanizePercentage }} is available.
          summary: Proxmox datastore is filling up.
        expr: pbs_used / pbs_size > 0.7 and pbs_used > 0 and predict_linear(pbs_available[6h], 4 * 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning

      - alert: ProxmoxBackupRootDiskOutOfSpace
        expr: "pbs_host_disk_used / pbs_host_disk_total * 100 > 90"
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Proxmox root disk out of space (instance {{ $labels.instance }})
          description: "Disk is almost full (< 10% left)\n  VALUE = {{ $value }}"

      - alert: ProxmoxBackupRootDiskFillingUpInFourDays
        annotations:
          description: Based on recent sampling, the root disk {{ $labels.instance }} is expected to fill up withing four days. Currently {{ $value | humanizePercentage }} is available.
          summary: Proxmox root disk is filling up.
        expr:
          pbs_host_disk_used / pbs_host_disk_total > 0.7 and pbs_host_disk_used > 0 and
          predict_linear(pbs_host_disk_available[6h], 4 * 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning

      - alert: ProxmoxBackupHostOutOfMemory
        expr: "pbs_host_memory_used / (pbs_host_memory_used + pbs_host_memory_free) * 100 > 90"
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Proxmox host out of memory (instance {{ $labels.instance }})
          description: "Node memory is filling up (< 10% left)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: ProxmoxBackupHostSwapIsFillingUp
        expr: "pbs_host_swap_used / (pbs_host_swap_used + pbs_host_swap_free) * 100 > 80"
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Proxmox host swap is filling up  (instance {{ $labels.instance }})
          description: "Swap is filling up (> 80%)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: ProxmoxBackupHostHighCpuLoad
        expr: "avg_over_time(pbs_host_cpu_usage[2m]) > 0.8"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host high CPU load (id {{ $labels.id }})

          description: "CPU load is > 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: ProxmoxBackupHostHighIowait
        expr: "avg by (instance) (rate(pbs_host_io_wait[5m]) * 100) > 10"
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Host CPU high iowait (instance {{ $labels.instance }})
          description: "CPU iowait > 10%. A high iowait means that you are disk or network bound.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: ProxmoxBackupSyncJobFailed
        expr: 'pbs_sync_job_last_run_status{status="error"} == 1'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Proxmox sync job failed (job {{ $labels.job_id }})
          description: "The last run of sync job {{ $labels.job_id }} on datastore {{ $labels.datastore }} failed."

      - alert: ProxmoxBackupPruneJobFailed
        expr: 'pbs_prune_job_last_run_status{status="error"} == 1'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Proxmox prune job failed (job {{ $labels.job_id }})
          description: "The last run of prune job {{ $labels.job_id }} on datastore {{ $labels.datastore }} failed."

      - alert: ProxmoxBackupVerifyJobFailed
        expr: 'pbs_verify_job_last_run_status{status="error"} == 1'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Proxmox verify job failed (job {{ $labels.job_id }})
          description: "The last run of verify job {{ $labels.job_id }} on datastore {{ $labels.datastore }} failed."

      - alert: ProxmoxBackupGarbageCollectionFailed
        expr: 'pbs_gc_last_run_status{status="error"} == 1'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Proxmox garbage collection failed (datastore {{ $labels.datastore }})
          description: "The last garbage collection on datastore {{ $labels.datastore }} failed."

      - alert: ProxmoxBackupGarbageCollectionNotRunRecently
        expr: "(time() - pbs_gc_last_run_start_timestamp_seconds) / 3600 / 24 > 7"
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: No Proxmox garbage collection finished for 7 days (datastore {{ $labels.datastore }})
          description: "No garbage collection on datastore {{ $labels.datastore }} has finished in the last 7 days. Check if it is failing or running for a very long time (pbs_gc_running)."

      - alert: ProxmoxBackupDatastoreInMaintenance
        expr: 'pbs_datastore_info{maintenance_mode!="none"} == 1'
        for: 1h
        labels:
          severity: info
        annotations:
          summary: Proxmox datastore in maintenance mode (datastore {{ $labels.datastore }})
          description: "Datastore {{ $labels.datastore }} is in {{ $labels.maintenance_mode }} maintenance mode."

      - alert: ProxmoxBackupTaskRunningTooLong
        expr: "(time() - pbs_task_running_start_timestamp_seconds) / 3600 > 12"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Proxmox task running for more than 12 hours ({{ $labels.worker_type }} {{ $labels.worker_id }})
          description: "Task {{ $labels.worker_type }} {{ $labels.worker_id }} has been running for {{ $value | humanize }} hours."
